name: release

# A push to main builds MalForge.exe on GitHub and publishes a release vX.Y.Z when that version has no
# release yet (bump __version__ in malforge/__init__.py). The app's self-update reads that release.
on:
  push:
    branches: [main]
    paths:
      - "malforge/**"
      - "main.py"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Version
        id: v
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('malforge/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build MalForge.exe
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          $env:QT_QPA_PLATFORM = "offscreen"
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --onefile --windowed --name MalForge --icon build/icon.ico --exclude-module tkinter main.py
          $hash = (Get-FileHash dist/MalForge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MalForge.exe" | Out-File dist/MalForge.exe.sha256 -Encoding ascii

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/MalForge.exe dist/MalForge.exe.sha256 `
            --title "MalForgé ${{ steps.v.outputs.version }}" --generate-notes
